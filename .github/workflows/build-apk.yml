name: Build DocuSnap Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Update SDK Manager and Accept All Licenses
        run: |
          sdkmanager --update || true
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and env file
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Installable Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK to DocuSnap.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DocuSnap.apk

      - name: Upload DocuSnap APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuSnap-APK
          path: app/build/outputs/apk/debug/DocuSnap.apk

      - name: Publish Latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "DocuSnap Android APK (Developed by Tahsin Islam)"
          body: |
            ### DocuSnap Pro Scanner — Ready to Install on Android
            **Developed by Tahsin Islam**

            ফোনে সরাসরি ডাউনলোড ও ইনস্টল করার জন্য নিচের **`DocuSnap.apk`** ফাইলটিতে ট্যাপ করুন।
          files: app/build/outputs/apk/debug/DocuSnap.apk
          prerelease: false
